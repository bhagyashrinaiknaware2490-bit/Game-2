name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate and unpack game project
        shell: bash
        run: |
          set -euo pipefail
          archive="LagoonStrikeAPK.zip"
          if [ ! -f "$archive" ]; then
            echo "Missing $archive in the repository root."
            exit 1
          fi
          if ! unzip -tq "$archive" >/dev/null; then
            echo "$archive is not a valid ZIP archive. Upload the complete LagoonStrikeAPK.zip file."
            exit 1
          fi
          unzip -q "$archive"
          if [ ! -f LagoonStrikeAPK/settings.gradle ] || [ ! -f LagoonStrikeAPK/app/build.gradle ]; then
            echo "The archive does not contain the expected LagoonStrikeAPK Android project."
            exit 1
          fi

      - name: Build debug APK
        working-directory: LagoonStrikeAPK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LagoonStrike-APK
          path: LagoonStrikeAPK/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
